project_id = "eebpmgilbguussctttgl"

# The Plaid proxy currently authenticates via the per-item X-Plaid-Access-Token
# header only (parity with the old Node backend). verify_jwt is disabled so the
# app can call it without a Supabase session bearer. FOLLOW-UP: gate this behind
# the logged-in user's JWT and move access-token storage server-side.
[functions.plaid]
verify_jwt = false

# Entitlement verification requires the caller's identity, so the JWT is
# enforced: the function reads auth.uid() from the session to know whose
# household(s) to stamp, and binds the receipt to that user via appAccountToken.
[functions.verify-entitlement]
verify_jwt = true
